# Repository registry (DESIGN.md §2).
#
# Adding a second DSpace instance is one more block here, plus a mapping
# profile under config/mappings/ if its metadata field names differ.
#
# base_url is the DSpace *server* root -- ScholarDrop appends /api itself.
#
# Two settings are global by default and overridable here, because institutions
# disagree about them (docs/DEPLOY-AWS.md, "More than one repository"):
#
#   session_ttl_seconds  this repository's idle session timeout. Set it to that
#                        DSpace's own jwt.login.token.expiration; ours is only
#                        right for a repository that kept the 30-minute default.
#   upload_max_bytes     the largest PDF this repository accepts. The edge's own
#                        limit (nginx client_max_body_size, or the ALB's) must be
#                        at or above the largest any instance sets.

instances:
  shareok 7.3 Test:
    name: SHAREOK 7.3 Test
    base_url: https://test.shareok.org/server
    mapping_profile: shareok-etd
    # Shown on the access-denied screen so a user knows who to ask (DESIGN.md §4).
    contact_email: shareok@ou.edu
    # cloud | local | heuristic -- which tier 1 backend this repository's
    # documents may go to (DESIGN.md §5; `llm` is the old spelling of `cloud`).
    # A submitter can narrow it further per submission with the upload page's
    # "restricted content" checkbox, which forces the local model.
    extraction: heuristic

  DSpace 9.2 Test:
    name: SHAREOK Test
    base_url: https://ds7up.dev.shareok.org/server
    mapping_profile: shareok-etd
    contact_email: shareok@ou.edu
    # Heuristic here: tier 2 costs no API calls and skips the cold grammar
    # compile. Switch to cloud (or local, see docs/local-llm.md) to exercise
    # tier 1 against this instance.
    extraction: heuristic


  DSpace 9.2 Prod:
    name: SHAREOK Prod
    base_url: https://shareok.org/server
    mapping_profile: shareok-etd
    contact_email: shareok@ou.edu
    # Heuristic here: tier 2 costs no API calls and skips the cold grammar
    # compile. Switch to cloud (or local, see docs/local-llm.md) to exercise
    # tier 1 against this instance.
    extraction: heuristic

  local:
    name: Local DSpace
    base_url: http://127.0.0.1:8080/server
    mapping_profile: shareok-etd
    contact_email: shareok@ou.edu
    # DESIGN.md §13.2, decided at the Phase 9 gate against this instance's own
    # configuration. NOT `authority`: dc.contributor.author here is controlled by
    # SolrAuthorAuthority, whose keys are authority-core uuids (24,374 of 25,009
    # author values carry one), so an ORCID iD in that key would be a dangling
    # reference. shareok.orcid is where this repository actually keeps iDs (1,739
    # values) and it is on the outhesispage1 / oudissertationpage1 forms.
    orcid_mode: field:shareok.orcid
    # Only on this VM do the UI and the API live on different ports; everywhere
    # else the default (base_url without /server) is right. Used to link to an
    # item a duplicate warning names (DESIGN.md §12).
    ui_url: http://127.0.0.1:4000
    # Heuristic here: tier 2 costs no API calls and skips the cold grammar
    # compile. Switch to cloud (or local, see docs/local-llm.md) to exercise
    # tier 1 against this instance.
    extraction: heuristic

  # The DSpace 9.2 on this VM. The only target where the sd-admin@test.invalid /
  # sd-user@test.invalid accounts and the `traditional` submission definition
  # exist -- and the only one where depositing does not write a real item into
  # SHAREOK. Sign in at /login/local.
  # local Mac:
  #   name: Local DSpace
  #   # VM "Alma DS9" (Parallels Shared network). From the macOS host, localhost is
  #   # the mac, not the VM -- reach DSpace at the VM's IP. Requires port 8080 open
  #   # on the VM (firewalld) and Tomcat bound to 0.0.0.0.
  #   base_url: http://10.211.55.23:8080/server
  #   mapping_profile: shareok-etd
  #   contact_email: shareok@ou.edu
  #   # Heuristic here: tier 2 costs no API calls and skips the cold grammar
  #   # compile. Switch to llm to exercise tier 1 against the local instance.
  #   extraction: heuristic
