{# One input for one value of one field. Also returned on its own by
   /review/{id}/row when a repeatable field gains a row. Expects `field`,
   `value`, and `row_index`.

   Only the first row carries the id the <label for> points at, so every later
   row states its own name (`aria-label`) -- otherwise an added author row is
   announced as an unlabelled edit box, which is what the accessibility pass
   found. `aria-describedby` ties the hint and the error text to the input, and a
   mandatory field says so with `aria-required` rather than the native `required`
   attribute: DSpace decides what is complete, and a browser refusing to submit
   would break saving an unfinished draft. #}
{% set row_index = row_index | default(0) %}
{% set label = field.config.label or field.config.metadata_field %}
{% set described = field.describedby %}
{# `row_index = none` means "appended by /review/{id}/row", which knows the field
   but not how many rows the page already has. Such a row is never the first, so
   it must not repeat the id -- two elements with one id is how the added input
   ended up sharing (and losing) the label. #}
{% set first = row_index is not none and row_index == 0 %}
{# Rendered both inside the whole form (where `form` exists) and on its own by
   /review/{id}/row (where only `wsi_id` does). #}
{% set draft_id = wsi_id if wsi_id is defined and wsi_id else form.workspaceitem_id %}
{% set row_label = label ~ (', value ' ~ (row_index + 1) if row_index else ', another value') %}
<div class="field-row">
  {% if field.config.is_choice and field.options %}
  <select {% if first %}id="{{ field.dom_id }}"{% else %}aria-label="{{ row_label }}"{% endif %}
          name="{{ field.name }}"
          {% if described %}aria-describedby="{{ described }}"{% endif %}
          {% if field.config.mandatory %}aria-required="true"{% endif %}
          {% if field.has_error %}aria-invalid="true"{% endif %}>
    <option value="">— choose —</option>
    {% for option in field.options %}
    <option value="{{ option.value }}"{% if option.value == value.value %} selected{% endif %}>{{ option.display }}</option>
    {% endfor %}
    {% if value.value and value.value not in field.options | map(attribute='value') | list %}
    <option value="{{ value.value }}" selected>{{ value.value }} (not in this list)</option>
    {% endif %}
  </select>
  {% elif field.config.multiline %}
  <textarea {% if first %}id="{{ field.dom_id }}"{% else %}aria-label="{{ row_label }}"{% endif %}
            name="{{ field.name }}" rows="6"
            {% if described %}aria-describedby="{{ described }}"{% endif %}
            {% if field.config.mandatory %}aria-required="true"{% endif %}
            {% if field.has_error %}aria-invalid="true"{% endif %}>{{ value.value }}</textarea>
  {% else %}
  <input type="text" class="value-input"
         {% if first %}id="{{ field.dom_id }}"{% else %}aria-label="{{ row_label }}"{% endif %}
         name="{{ field.name }}"
         value="{{ value.value }}"
         {% if described %}aria-describedby="{{ described }}"{% endif %}
         {% if field.config.mandatory %}aria-required="true"{% endif %}
         {% if field.has_error %}aria-invalid="true"{% endif %}
         {% if field.config.input_type == 'date' %}placeholder="YYYY-MM-DD"{% endif %}
         {% if field.orcid_lookup %}
         autocomplete="off"
         hx-get="/review/{{ draft_id }}/orcid?field={{ field.dom_id | urlencode }}&amp;name={{ field.name | urlencode }}"
         hx-trigger="keyup changed delay:400ms"
         {# `next`, not `closest ... find ...`: htmx's extended selectors are a
            prefix, not a chain, and the suggestions div is the next matching
            element after this input inside the row. #}
         hx-target="next .orcid-suggestions"
         hx-swap="innerHTML"
         {# htmx sends the triggering input's own value under its own name, so
            the endpoint is told that name up front and reads the query from it.
            The obvious `hx-vals="js:{q: event.target.value}"` does *not* work:
            htmx 2.0.4 evaluates hx-vals with no `event` in scope, and the only
            symptom is a console error and a request that never happens. #}
         {% elif field.vocabulary_lookup %}
         {# The same mechanism against the repository's own vocabulary
            (DESIGN.md §13.4). This field is bound to one DSpace would not list,
            so the box searches it rather than accepting anything at all. #}
         autocomplete="off"
         hx-get="/review/{{ draft_id }}/vocabulary?vocabulary={{ field.config.vocabulary | urlencode }}&amp;field={{ field.dom_id | urlencode }}&amp;name={{ field.name | urlencode }}"
         hx-trigger="keyup changed delay:400ms"
         hx-target="next .vocabulary-suggestions"
         hx-swap="innerHTML"
         {% endif %}>
  {% endif %}

  {# Text, not colour or a tooltip: `title` is not reliably announced, and the
     badge is the only signal that a value was guessed. #}
  {% if value.low_confidence and value.value %}
  <span class="badge badge-check">check this — a heuristic guessed it</span>
  {% elif value.prefilled %}
  {# Where it came from, not how: a value the publisher's own record supplied
     deserves less re-checking than one read off a title page (DESIGN.md §13.1). #}
  <span class="badge">from the {{ value.provenance or 'PDF' }}</span>
  {% endif %}

  {# The chosen iD travels as a hidden input beside its value, in document order,
     because that is how `patch.parse_rows` pairs them -- an empty row would break
     any pairing done by index (DESIGN.md §13.2). It is rendered whether or not
     this instance stores iDs: the form has to survive a validation error with the
     choice intact either way. #}
  {% if field.orcid_lookup %}
  <input type="hidden" class="orcid-input" name="{{ field.orcid_name }}" value="{{ value.orcid }}">
  <span class="badge orcid-chosen" aria-live="polite">{{ value.orcid }}</span>
  <div class="orcid-suggestions"></div>
  {% endif %}

  {# Where the suggestions land, and the only signal on the page that this box is
     not free text after all. #}
  {% if field.vocabulary_lookup %}
  <div class="vocabulary-suggestions"></div>
  {% endif %}

  {# Which language *this value* is in (DESIGN.md §13.4). Rendered on every row of
     a translatable field, not only on added ones: a work whose title is Chinese
     and whose translation is English needs to say so about the first row too, and
     the empty option means "the repository's default", which is what an ordinary
     submission leaves it at. It sits immediately after the value, because
     `patch.parse_rows` pairs the two by document order. #}
  {% if field.translatable %}
  <select class="row-language" name="{{ field.lang_name }}"
          aria-label="Language of this {{ label | lower }}{{ ', value ' ~ (row_index + 1) if row_index else '' }}">
    <option value="">— language: repository default —</option>
    {% for code, name in field.language_options %}
    <option value="{{ code }}"{% if code == value.language %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  {% endif %}

  {% if field.config.repeatable %}
  <button type="button" class="link-button row-remove"
          aria-label="Remove this {{ label | lower }} value"
          hx-on:click="this.closest('.field-row').remove()">Remove</button>
  {% endif %}
</div>
