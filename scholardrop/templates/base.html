<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScholarDrop{% endblock %}</title>
  {# htmx injects its own `.htmx-indicator` rules as an inline <style> at boot,
     which `style-src 'self'` blocks -- silently, in the console. app.css already
     defines those rules, so turn the injection off rather than admitting
     'unsafe-inline' for a duplicate of CSS we ship. Found by the browser gate. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
</head>
<body>
  {# First focusable thing on every page: the header repeats on all of them and
     nobody should tab through it to reach the form they came for. #}
  <a class="skip-link" href="#content">Skip to the main content</a>
  <header class="site-header">
    <a class="brand" href="/">ScholarDrop</a>
    <span class="tagline">Drop a PDF. Deposit a publication.</span>
    {% if signed_in_as %}
    <div class="whoami">
      <span>{{ signed_in_as }}{% if instance %} at {{ instance.name }}{% endif %}</span>
      <a href="/drafts">Drafts</a>
      {# role="none" so a one-button sign-out form is not offered as a landmark. #}
      <form method="post" action="/logout" role="none">
        <button type="submit" class="link-button">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>

  <main id="content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>ScholarDrop {{ request.app.version }}</span>
  </footer>
</body>
</html>
