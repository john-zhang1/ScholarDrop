# nginx for ScholarDrop, matching the DSpace 9.2 host pattern (certbot-managed TLS).
#
#   sudo cp deploy/nginx-scholardrop.conf /etc/nginx/conf.d/scholardrop.conf
#   sudo certbot --nginx -d scholardrop.example.edu
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot rewrites the listen/ssl_certificate lines below in place; everything
# else here is ours to keep.

server {
    listen 80;
    listen [::]:80;
    server_name scholardrop.example.edu;

    # ACME first, then everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scholardrop.example.edu;

    ssl_certificate     /etc/letsencrypt/live/scholardrop.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scholardrop.example.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/scholardrop.access.log;
    error_log  /var/log/nginx/scholardrop.error.log;

    # The app caps uploads itself and refuses anything larger with a message; this
    # is the same limit one layer out, so a 200 MB upload is dropped at the edge.
    # Keep it >= SCHOLARDROP_UPLOAD_MAX_BYTES or nginx will 413 before the app can
    # explain why.
    client_max_body_size 100m;
    client_body_timeout 300s;

    # Transport-level only. The Content-Security-Policy is set by the app
    # (scholardrop/security.py), which is the layer that knows what its pages load;
    # the app sends the three below too, with setdefault, so these stay harmless.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        # Host must survive the hop: the app compares the Origin of a POST
        # against it to refuse cross-site requests (scholardrop/security.py).
        proxy_set_header Host              $host;
        # X-Forwarded-For is where the login rate limiter's client identity comes
        # from, but the app never parses it: uvicorn's --proxy-headers does, and
        # only from this trusted proxy, taking the entry nginx appended below.
        # $proxy_add_x_forwarded_for keeps whatever the client sent, so the
        # left-hand entries are forgeable — never key anything on them.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ties the app's log lines to nginx's.
        proxy_set_header X-Request-ID      $request_id;

        # Extraction of a large PDF can take a while before the first byte.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
